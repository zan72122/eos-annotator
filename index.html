<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes"><title>好酸球 点打ち</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#eee;font:15px -apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
.ctl{position:fixed;z-index:5;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;min-width:44px;height:44px;font-size:20px;padding:0 10px;top:calc(env(safe-area-inset-top) + 8px)}
#bMenu{left:8px}#bUndo{left:62px}#cnt{right:8px;font-size:15px;line-height:44px;pointer-events:none}
#menu{position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 58px);left:8px;max-height:80vh;overflow:auto;background:rgba(20,20,20,.93);border:1px solid #555;border-radius:10px;padding:10px;width:300px;display:none}
#menu button,#menu select{display:block;width:100%;margin:5px 0;min-height:42px;font-size:15px;background:#333;color:#fff;border:1px solid #666;border-radius:7px}
#menu .on{background:#eee;color:#000}#menu small{color:#aaa;display:block;margin:6px 0}
#hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;pointer-events:none;padding:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 14px;border-radius:8px;display:none;z-index:9}
#csvbox{width:100%;height:120px;display:none;font-size:11px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hint">☰ →「画像を開く」で画像を選択（複数可）<br>タップ＝点を追加／点をタップ＝削除／長押し＝不確実<br>2本指でズーム・移動<br><small>画像はこの端末内だけで処理され、どこにも送信されません</small></div>
<button class="ctl" id="bMenu" aria-label="menu">☰</button>
<button class="ctl" id="bUndo" aria-label="undo">↶</button>
<div class="ctl" id="cnt">0</div>
<div id="menu">
<button id="mOpen">画像を開く（複数可）</button>
<input type="file" id="file" accept="image/*" multiple style="display:none">
<select id="sel"></select>
<button id="mPrev">◀ 前の画像</button><button id="mNext">次の画像 ▶</button>
<button id="mMode">モード：通常（好酸球）</button>
<button id="mHide">点を隠す</button>
<button id="mSize">点の大きさ：中</button>
<button id="mFit">全体表示に戻す</button>
<small>書き出し（CSV: image,x,y,label）</small>
<button id="mExp">この画像のCSVを保存/共有</button>
<button id="mExpAll">全画像のCSVを保存/共有</button>
<button id="mCopy">全画像のCSVをコピー</button>
<textarea id="csvbox" readonly></textarea>
<button id="mClear">この画像の点を全削除</button>
<small>保存は自動（この端末のブラウザ内）。画像はアップロードされません。</small>
</div>
<div id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
let imgs=[],cur=-1,view={s:1,x:0,y:0},mode='eos',hide=false,sizeIdx=1,dpr=1;
const SIZES=[['小',0.6],['中',1],['大',1.6]];
const key=m=>'eosann:'+m.name+':'+m.size;
function load(m){try{const d=JSON.parse(localStorage.getItem(key(m))||'null');if(d&&d.points)return d.points}catch(e){}return []}
function save(m){try{localStorage.setItem(key(m),JSON.stringify({name:m.name,w:m.w,h:m.h,points:m.pts,t:Date.now()}))}catch(e){toast('保存失敗：容量不足の可能性')}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2000)}
function resize(){dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;draw()}
function fit(){const m=imgs[cur];if(!m)return;const s=Math.min(innerWidth/m.w,innerHeight/m.h);view={s,x:(innerWidth-m.w*s)/2,y:(innerHeight-m.h*s)/2};draw()}
function rad(m){return Math.max(4,Math.min(m.w,m.h)*0.012)*SIZES[sizeIdx][1]} // image px
function draw(){cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#111';cx.fillRect(0,0,cv.width,cv.height);const m=imgs[cur];
 $('hint').style.display=m?'none':'flex';if(!m){$('cnt').textContent='0';return}
 cx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);cx.imageSmoothingEnabled=view.s<2;cx.drawImage(m.img,0,0);
 if(!hide){const r=rad(m),lw=Math.max(1.5/view.s,r*0.18);cx.lineWidth=lw;
  for(const p of m.pts){cx.beginPath();cx.arc(p.x,p.y,r,0,7);cx.strokeStyle=p.label==='eos'?'#00ff66':'#ffd400';if(p.label!=='eos')cx.setLineDash([r*0.5,r*0.4]);else cx.setLineDash([]);cx.stroke();
   cx.setLineDash([]);cx.beginPath();cx.arc(p.x,p.y,Math.max(lw*0.8,1/view.s),0,7);cx.fillStyle=cx.strokeStyle;cx.fill()}}
 const e=m.pts.filter(p=>p.label==='eos').length,u=m.pts.length-e;
 $('cnt').textContent=(imgs.length>1?(cur+1)+'/'+imgs.length+' ':'')+e+(u?' (+'+u+'?)':'')+(mode==='uncertain'?' ?':'')}
function toImg(sx,sy){return {x:(sx-view.x)/view.s,y:(sy-view.y)/view.s}}
function r1(v){return Math.round(v*10)/10}
function tapAt(sx,sy,lp){const m=imgs[cur];if(!m)return;const q=toImg(sx,sy);
 const hit=Math.max(rad(m),22/view.s);let bi=-1,bd=1e9;m.pts.forEach((p,i)=>{const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;bi=i}});
 if(bi>=0&&bd<=hit){const p=m.pts[bi];if(lp){m.undo.push({t:'lab',i:bi,old:p.label});p.label=p.label==='eos'?'uncertain':'eos'}else{m.undo.push({t:'del',i:bi,p});m.pts.splice(bi,1)}}
 else{if(q.x<0||q.y<0||q.x>=m.w||q.y>=m.h)return;const p={x:r1(q.x),y:r1(q.y),label:(lp||mode==='uncertain')?'uncertain':'eos'};m.pts.push(p);m.undo.push({t:'add'})}
 save(m);draw()}
function undo(){const m=imgs[cur];if(!m||!m.undo.length)return;const u=m.undo.pop();if(u.t==='add')m.pts.pop();else if(u.t==='del')m.pts.splice(u.i,0,u.p);else m.pts[u.i].label=u.old;save(m);draw()}
// gestures
const ptr=new Map();let g=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===1){g={kind:'tap',sx:e.clientX,sy:e.clientY,t:Date.now(),lx:e.clientX,ly:e.clientY,multi:false};
  g.lpT=setTimeout(()=>{if(g&&g.kind==='tap'&&!g.multi){g.kind='done';tapAt(g.sx,g.sy,true);if(navigator.vibrate)navigator.vibrate(20)}},550)}
 else if(g){g.multi=true;g.kind='pinch';clearTimeout(g.lpT);startPinch()}});
function pts2(){const a=[...ptr.values()];return a.slice(0,2)}
function startPinch(){const[a,b]=pts2();g.d0=Math.hypot(a.x-b.x,a.y-b.y)||1;g.c0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};g.v0={...view}}
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||!g)return;e.preventDefault();ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(g.kind==='pinch'&&ptr.size>=2){const[a,b]=pts2();const d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  const s=Math.min(60,Math.max(0.05,g.v0.s*d/g.d0));const ix=(g.c0.x-g.v0.x)/g.v0.s,iy=(g.c0.y-g.v0.y)/g.v0.s;view={s,x:c.x-ix*s,y:c.y-iy*s};draw()}
 else if(ptr.size===1&&(g.kind==='tap'||g.kind==='pan')){if(g.kind==='tap'&&Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>10){g.kind='pan';clearTimeout(g.lpT)}
  if(g.kind==='pan'){view.x+=e.clientX-g.lx;view.y+=e.clientY-g.ly;draw()}g.lx=e.clientX;g.ly=e.clientY}});
function end(e){if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(!g)return;
 if(ptr.size===0){clearTimeout(g.lpT);if(g.kind==='tap'&&!g.multi&&e.type==='pointerup')tapAt(g.sx,g.sy,e.shiftKey);g=null}
 else if(g.kind==='pinch'&&ptr.size>=2)startPinch();else if(g.kind==='pinch'){g.kind='pinchrest'}}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.002),s=Math.min(60,Math.max(0.05,view.s*f));const ix=(e.clientX-view.x)/view.s,iy=(e.clientY-view.y)/view.s;view={s,x:e.clientX-ix*s,y:e.clientY-iy*s};draw()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.target===cv||e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
// images
$('mOpen').onclick=()=>$('file').click();
$('file').onchange=async e=>{const fs=[...e.target.files];for(const f of fs){const url=URL.createObjectURL(f);const img=new Image();
  await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url}).catch(()=>toast('読込失敗: '+f.name));if(!img.naturalWidth)continue;
  let ex=imgs.findIndex(m=>m.name===f.name&&m.size===f.size);if(ex>=0){cur=ex;continue}
  const m={name:f.name,size:f.size,img,w:img.naturalWidth,h:img.naturalHeight,undo:[]};m.pts=load(m);imgs.push(m);cur=imgs.length-1}
 e.target.value='';refreshSel();fit();if(fs.length)$('menu').style.display='none'};
function refreshSel(){$('sel').innerHTML=imgs.map((m,i)=>`<option value="${i}">${m.name.replace(/[<&]/g,'')} (${m.pts.filter(p=>p.label==='eos').length})</option>`).join('');$('sel').value=cur}
function go(i){if(!imgs.length)return;cur=(i+imgs.length)%imgs.length;refreshSel();fit()}
$('sel').onchange=e=>go(+e.target.value);$('mPrev').onclick=()=>go(cur-1);$('mNext').onclick=()=>go(cur+1);
$('bMenu').onclick=()=>{const v=$('menu').style.display==='block';if(!v)refreshSel();$('menu').style.display=v?'none':'block'};
$('bUndo').onclick=undo;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();undo()}});
$('mMode').onclick=()=>{mode=mode==='eos'?'uncertain':'eos';$('mMode').textContent='モード：'+(mode==='eos'?'通常（好酸球）':'不確実（?）');$('mMode').classList.toggle('on',mode!=='eos');draw()};
$('mHide').onclick=()=>{hide=!hide;$('mHide').textContent=hide?'点を表示':'点を隠す';$('mHide').classList.toggle('on',hide);draw()};
$('mSize').onclick=()=>{sizeIdx=(sizeIdx+1)%3;$('mSize').textContent='点の大きさ：'+SIZES[sizeIdx][0];draw()};
$('mFit').onclick=()=>{fit();$('menu').style.display='none'};
$('mClear').onclick=()=>{const m=imgs[cur];if(m&&confirm(m.name+' の点を全削除しますか？')){m.pts=[];m.undo=[];save(m);draw()}};
// export
function csvq(s){s=String(s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function makeCSV(list){return 'image,x,y,label\n'+list.flatMap(m=>m.pts.map(p=>[csvq(m.name),p.x,p.y,p.label].join(','))).join('\n')+'\n'}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())}
async function exportCSV(list,fname){if(!list.length)return toast('画像がありません');const csv=makeCSV(list);window.__lastCSV=csv;
 const file=new File([csv],fname,{type:'text/csv'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fname});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('保存: '+fname)}
$('mExp').onclick=()=>{const m=imgs[cur];if(m)exportCSV([m],m.name.replace(/\.[^.]+$/,'')+'.csv')};
$('mExpAll').onclick=()=>exportCSV(imgs,'eos_points_'+stamp()+'.csv');
$('mCopy').onclick=async()=>{const csv=makeCSV(imgs);window.__lastCSV=csv;try{await navigator.clipboard.writeText(csv);toast('コピーしました')}catch(e){const t=$('csvbox');t.style.display='block';t.value=csv;t.focus();t.select();toast('自動コピー不可：枠内を選択してコピー')}};
addEventListener('resize',()=>{resize();fit()});resize();
window.__eos={imgs:()=>imgs,makeCSV,view:()=>view};
</script></body></html>
